{% extends 'base.html' %}

{% block title %}Order Successful{% endblock %}

{% block content %}
<div class="success">
    <h1>🎉 Order Placed Successfully!</h1>
    <p>Thank you <strong>{{ order.full_name }}</strong>!</p>
    <p>Order ID: <strong>#{{ order.id }}</strong></p>
    <p>Total: <strong>${{ order.total_price }}</strong></p>
    <p>We will contact you at: {{ order.email }}</p>
    <a href="{% url 'products:list' %}" class="btn">Continue Shopping 🛍</a>
</div>
{% endblock %}
