{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeAlpha Shop{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="{% url 'products:list' %}" class="logo">🛍 CodeAlpha Shop</a>
            <a href="{% url 'cart:detail' %}" class="cart-icon">
                🛒 Cart ({{ request.session.cart|length|default:0 }})
            </a>
        </div>
    </nav>
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
